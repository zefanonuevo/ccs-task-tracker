<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CCS Task Tracker</title>
<style>
/* Layout concept: a macOS-style window. Frosted sticky toolbar, segmented tabs, grouped surfaces, a floating inspector for the ticket drawer. */
:root{
  --paper:#f5f5f7; --surface:#ffffff; --raised:#ffffff; --ink:#1d1d1f; --muted:#6e6e73; --line:#e3e3e8;
  --accent:#0066cc; --accent-fill:#0071e3; --accent-ink:#ffffff; --accent-soft:#e8f1fc;
  --good:#1d7a36; --good-soft:#e3f3e8; --warn:#a64b00; --warn-soft:#fdeedd; --crit:#c4001a; --crit-soft:#fde7ea;
  --st-new:#8e8e93; --st-assigned:#5e5ce6; --st-progress:#0071e3; --st-hold:#ff9f0a; --st-done:#30a14e;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --hm1:#cde2fb; --hm2:#9ec5f4; --hm3:#6da7ec; --hm4:#3987e5; --hm5:#1c5cab;
  --fill:rgba(118,118,128,.12); --scrim:rgba(0,0,0,.28);
  --shadow-1:0 1px 2px rgba(0,0,0,.05); --shadow-hover:0 4px 14px rgba(0,0,0,.1); --shadow-2:0 12px 40px rgba(0,0,0,.16),0 0 0 .5px rgba(0,0,0,.08);
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  --f-display:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif;
  --f-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1c1c1e; --surface:#2c2c2e; --raised:#353538; --ink:#f5f5f7; --muted:#a1a1a6; --line:#3a3a3c;
  --accent:#4aa3ff; --accent-fill:#0a6fd6; --accent-ink:#ffffff; --accent-soft:#1b2f47;
  --good:#30d158; --good-soft:#163524; --warn:#ff9f0a; --warn-soft:#3b2a0c; --crit:#ff6961; --crit-soft:#401c1a;
  --st-new:#98989d; --st-assigned:#7d7aff; --st-progress:#4aa3ff; --st-hold:#ff9f0a; --st-done:#30d158;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --hm1:#1c5cab; --hm2:#256abf; --hm3:#3987e5; --hm4:#6da7ec; --hm5:#9ec5f4;
  --fill:rgba(118,118,128,.24); --scrim:rgba(0,0,0,.5);
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-hover:0 4px 14px rgba(0,0,0,.45); --shadow-2:0 12px 40px rgba(0,0,0,.55),0 0 0 .5px rgba(255,255,255,.08);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1c1c1e; --surface:#2c2c2e; --raised:#353538; --ink:#f5f5f7; --muted:#a1a1a6; --line:#3a3a3c;
  --accent:#4aa3ff; --accent-fill:#0a6fd6; --accent-ink:#ffffff; --accent-soft:#1b2f47;
  --good:#30d158; --good-soft:#163524; --warn:#ff9f0a; --warn-soft:#3b2a0c; --crit:#ff6961; --crit-soft:#401c1a;
  --st-new:#98989d; --st-assigned:#7d7aff; --st-progress:#4aa3ff; --st-hold:#ff9f0a; --st-done:#30d158;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --hm1:#1c5cab; --hm2:#256abf; --hm3:#3987e5; --hm4:#6da7ec; --hm5:#9ec5f4;
  --fill:rgba(118,118,128,.24); --scrim:rgba(0,0,0,.5);
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-hover:0 4px 14px rgba(0,0,0,.45); --shadow-2:0 12px 40px rgba(0,0,0,.55),0 0 0 .5px rgba(255,255,255,.08);
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:400 14px/1.5 var(--f-body)}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em;line-height:1.15}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.wrap{max-width:1320px;margin-inline:auto;padding-inline:16px}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between;padding-block:12px 6px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand h1{font-size:21px;font-weight:700}
.brand p{font-size:12px;color:var(--muted)}
.vtag{font:500 10.5px var(--f-mono);border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted);margin-left:6px;vertical-align:middle;letter-spacing:.04em}
.mark{flex:none;width:34px;height:34px;border-radius:7px;background:var(--accent);display:grid;place-items:center}
.mark svg{display:block}
.sim{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.clock{display:flex;align-items:baseline;gap:8px;font-size:12.5px;color:var(--muted)}
.clock b{font:500 20px var(--f-mono);color:var(--ink)}
.tag{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;padding:2px 6px;border:1px solid var(--line);border-radius:4px}
.tag.on{color:var(--accent);border-color:var(--accent)}
.simctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row2{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:2px;overflow-x:auto;min-width:0;scrollbar-width:thin}
.tab{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;cursor:pointer;color:var(--muted);font-weight:500;display:inline-flex;gap:6px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.bdg{font:500 11px var(--f-mono);background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:0 6px;min-width:18px;text-align:center}
.bdg:empty{display:none}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.me{display:flex;align-items:center;gap:10px;font-size:12.5px;padding-block:4px}
.me b{display:block;font-weight:600;line-height:1.2}
.me small{color:var(--muted);font-size:11.5px}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border:1px solid var(--line);background:var(--raised);border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.btn.warn:hover{background:var(--warn-soft)}
.btn.small{min-height:30px;padding:0 10px;font-size:12.5px}
.btn.ghost{background:none}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
select,input[type=text],input[type=email],input[type=password],input[type=date],input[type=search],textarea{min-height:36px;padding:6px 10px;border:1px solid var(--line);background:var(--raised);border-radius:6px;max-width:100%}
select.small{min-height:30px;padding:2px 8px;font-size:12.5px}
input[readonly],select:disabled{background:var(--surface);color:var(--muted)}
textarea{width:100%;resize:vertical;min-height:80px}
input[type=file]{max-width:100%;font-size:12.5px}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld .lab,.lab{font-size:12px;font-weight:600;color:var(--muted)}
.fld input,.fld select{width:100%}
.err{color:var(--crit);font-size:12px}
.err:empty{display:none}
[aria-invalid="true"]{border-color:var(--crit)!important}

/* sign in */
.loginwrap{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:28px;align-items:start;max-width:1000px;margin:8px auto 0}
.logincard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:14px}
.logincard h2{font-size:28px;font-weight:700}
.accs{display:flex;flex-direction:column;gap:6px}
.accs h3{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:10px}
.accs>h2{font-size:18px}
.acc{display:grid;grid-template-columns:32px minmax(0,1fr);gap:0 10px;align-items:center;text-align:left;width:100%;background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer}
.acc:hover{border-color:var(--accent)}
.acc .av{grid-row:span 2}
.acc b{font-weight:600}
.acc small{color:var(--muted);font:400 11.5px var(--f-mono);overflow-wrap:anywhere}

/* main */
main{padding-block:18px 56px}
.panel>h2{font-size:24px;font-weight:700;margin-bottom:4px}
.lede{color:var(--muted);max-width:68ch;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:16px}
.kpi{display:flex;flex-direction:column;padding:12px 16px 12px 0;min-width:0}
.k-l{font-size:12px;color:var(--muted);font-weight:500}
.k-n{font:700 28px/1.15 var(--f-display);font-variant-numeric:tabular-nums}
.k-n.warn{color:var(--warn)} .k-n.crit{color:var(--crit)} .k-n.good{color:var(--good)}
.k-s{font-size:12px;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:end;margin-bottom:14px}
.filters .grow{flex:1 1 220px}
.sec{margin-top:26px}
.sec>h2{font-size:18px;margin-bottom:8px}

/* board */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;align-items:start}
.col{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col>header{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 4px}
.col h3{font-size:14px;font-weight:700}
.col .n{font:500 12px var(--f-mono);color:var(--muted)}
.empty{font-size:12.5px;color:var(--muted);padding:10px 2px}
.more{font-size:12px;color:var(--muted);padding:2px}
.card{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:0}
.card:hover{border-color:var(--accent)}
.c-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tid{font:500 11.5px var(--f-mono);color:var(--muted)}
.c-title{font-weight:600;line-height:1.3}
.c-meta{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.c-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.c-act{margin-top:2px}
.prio{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.prio.p-high{color:var(--warn)} .prio.p-urgent{color:var(--crit)}
.av{flex:none;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:600 10.5px var(--f-body)}
.av.none{background:none;border:1px dashed var(--line);color:var(--muted)}
.av.lg{width:40px;height:40px;font-size:14px}
.chip{font:500 11.5px var(--f-mono);padding:2px 7px;border-radius:4px;white-space:nowrap;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.chip.ok,.chip.met,.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.risk,.chip.paused{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.breach,.chip.late{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.run{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500}
.st::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.stars{display:inline-flex;align-items:center;gap:3px;font:500 12px var(--f-mono);color:var(--warn)}
.feed{margin-top:22px}
.feed h2{font-size:17px;margin-bottom:8px}
.feed ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.feed li{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;min-width:0}
.feed time{flex:none;font:400 12px var(--f-mono);color:var(--muted);width:92px}
.feed span{min-width:0;overflow-wrap:anywhere}

/* drawer */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:50;overflow-y:auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.d-head{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:10px}
.d-head h2{font-size:22px;font-weight:700;margin-top:2px}
.d-chips{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:14px}
.d-sec{border-top:1px solid var(--line);padding-block:14px;display:flex;flex-direction:column;gap:10px}
.d-sec h3{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-family:var(--f-body);font-weight:600}
dl.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;margin:0}
dl.kv dt{color:var(--muted);font-size:12.5px}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inline select{flex:1 1 200px;min-width:0}
.note{font-size:12.5px;color:var(--muted)}
.trk{border:1px solid var(--line);border-radius:8px;background:var(--raised);padding:12px 14px;display:flex;flex-direction:column;gap:9px;margin-bottom:6px}
.trk-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.trk .bar-t{height:10px}
.trk .bar-t i.warn{background:var(--warn)} .trk .bar-t i.crit{background:var(--crit)}
.trk-n{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qpick{display:flex;flex-wrap:wrap;gap:6px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.tl li{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;font-size:13px}
.tl time{font:400 11.5px var(--f-mono);color:var(--muted);padding-top:2px}
.kind{display:inline-block;font:500 10px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);margin-right:6px}
.k-update .kind{color:var(--accent);border-color:var(--accent)}
.k-hold .kind{color:var(--warn);border-color:var(--warn)}
.k-alert .kind{color:var(--crit);border-color:var(--crit)}
.k-done .kind{color:var(--good);border-color:var(--good)}
.rm{display:block;margin-top:4px;padding:5px 9px;border-left:2px solid var(--line);background:var(--raised);font-size:12.5px;overflow-wrap:anywhere}
.k-update .rm{border-left-color:var(--accent)} .k-hold .rm{border-left-color:var(--warn)}
.by{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.ratebtn{background:none;border:0;padding:3px;cursor:pointer;color:var(--warn);border-radius:4px}
.ratebtn:hover{background:var(--warn-soft)}
.evrow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:2px 10px;align-items:center}
.evrow small{grid-column:2;color:var(--muted);font-size:12px}

/* form */
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px;align-items:start}
.catalog{display:flex;flex-direction:column;gap:6px}
.catalog h2{font-size:18px;margin-bottom:2px}
.grp{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:10px}
.svc{display:block;cursor:pointer}
.svc input{position:absolute;opacity:0;pointer-events:none}
.svc-b{display:flex;flex-direction:column;gap:1px;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--raised)}
.svc-b small{color:var(--muted);font:400 11.5px var(--f-mono)}
.svc:hover .svc-b{border-color:var(--accent)}
.svc input:checked+.svc-b{border-color:var(--accent);background:var(--accent-soft)}
.svc input:focus-visible+.svc-b{outline:2px solid var(--accent);outline-offset:2px}
.formcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.sum b.t{font:700 16px var(--f-display)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.sample{font-size:12.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
.ok-card{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px}
.ok-card h3{font-size:17px}

/* monitoring */
.bar-t{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar-t i{display:block;height:100%;background:var(--accent)}
.hls{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.hl{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.hl .who2{display:flex;gap:8px;align-items:center;font:700 16px var(--f-display)}
.hl ul{margin:0;padding-left:16px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.out{display:flex;flex-direction:column;gap:12px}
.out-row{display:grid;grid-template-columns:130px minmax(0,1fr);gap:4px 12px;align-items:center}
.stack{display:flex;height:20px;border-radius:4px;overflow:hidden;background:var(--line)}
.stack i{display:block;height:100%}
.sg-good{background:var(--good)} .sg-late{background:var(--warn)} .sg-crit{background:var(--crit)} .sg-open{background:var(--muted);opacity:.5}
.out-n{grid-column:2;font:400 11.5px var(--f-mono);color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin-bottom:10px}
.legend span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;background:var(--c)}
.acols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;align-items:start}
.acol{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.acol>header{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;justify-content:space-between}
.acol .nm{display:flex;gap:8px;align-items:center;min-width:0;font-weight:600}
.mi{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 8px;text-align:left;background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:7px 9px;cursor:pointer;width:100%}
.mi:hover{border-color:var(--accent)}
.mi .mi-t{font-weight:500;overflow-wrap:anywhere}
.mi-f{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rank{display:flex;flex-direction:column;gap:10px}
.srow{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;grid-template-columns:34px minmax(0,1.3fr) minmax(0,3fr);gap:6px 16px;align-items:center}
.pos{font:700 24px var(--f-display);color:var(--muted)}
.s-name{display:flex;gap:10px;align-items:center;min-width:0}
.s-name b{display:block;font-weight:600}
.s-name small{color:var(--muted);font-size:12px}
.s-score{display:flex;flex-direction:column;gap:6px;min-width:0}

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};

var down=false;

/* ---------- time: office hours Mon-Fri 08:00-17:00, skipping the days listed in Settings ---------- */
var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var pad=function(n){return String(n).padStart(2,'0')};
var fmtT=function(d){return pad(d.getHours())+':'+pad(d.getMinutes())};
var fmtD=function(d){return DAYS[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]};
var fmtDT=function(d){return fmtD(d)+' · '+fmtT(d)};
var D=function(day,h,m){return new Date(2026,9,day,h,m)};
var WS=480,WE=1020;
var mins=function(d){return d.getHours()*60+d.getMinutes()};
var CLOSED={};
var dkey=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var fmtDY=function(d){return fmtD(d)+' '+d.getFullYear()};
var isWd=function(d){return d.getDay()>0&&d.getDay()<6&&!CLOSED[dkey(d)]};
function norm(d){d=new Date(d);for(;;){
  if(!isWd(d)){d.setDate(d.getDate()+1);d.setHours(8,0,0,0);continue}
  var m=mins(d);
  if(m<WS){d.setHours(8,0,0,0);return d}
  if(m>=WE){d.setDate(d.getDate()+1);d.setHours(8,0,0,0);continue}
  return d}}
function addWork(d,m){d=norm(d);while(m>0){var rem=WE-mins(d);

 update:function(t,x){return {subject:'['+t.id+'] Update on your request',body:'Hello '+sal(t.req)+',\n\n'+staffName(t.assignee)+' posted an update on "'+t.svc.name+'":\n\n"'+x+'"\n\nTarget completion: '+fmtDT(t.due)+SIG}},
 hold:function(t){return {subject:'['+t.id+'] We need something from you',body:'Hello '+sal(t.req)+',\n\nYour request "'+t.svc.name+'" is on hold:\n\n"'+t.holdReason+'"\n\nThe time tracker is paused until we can continue. Please reply on the ticket or by email.'+SIG}},

 autoclosed:function(t){return {subject:'['+t.id+'] Closed without an evaluation',body:'"'+t.svc.name+'" from '+t.req.name+' closed automatically on '+fmtDT(t.closedAt)+' because no evaluation arrived within '+t.evalDays+' working days of completion.\n\nNo ratings were recorded for '+staffName(t.assignee)+'.'+SIG}},
 rated:function(t){return {subject:'['+t.id+'] '+t.req.name+' evaluated the service ('+t.rating.toFixed(1)+'/5)',body:'Request "'+t.svc.name+'" was evaluated:\n\nQuality: '+t.ratings.q+'/5\nPunctuality: '+t.ratings.p+'/5\nExpertise: '+t.ratings.e+'/5\nAverage: '+t.rating.toFixed(1)+'/5'+(t.comment?'\n\nComment: "'+t.comment+'"':'')+SIG}},
 unassigned:function(t){return {subject:'['+t.id+'] Waiting for an assistant',body:'"'+t.svc.name+'" from '+t.req.name+' has had no assistant for '+dur(workBetween(t.created,S.now))+'.\nTarget completion: '+fmtDT(t.due)+'\n\nAssign it from the board.'+SIG}},
 unstarted:function(t){return {subject:'['+t.id+'] Assigned but not started',body:staffName(t.assignee)+' was assigned "'+t.svc.name+'" '+dur(workBetween(t.assignedAt,S.now))+' ago and has not started.\nTarget completion: '+fmtDT(t.due)+SIG}},
 risk:function(t){var r=sla(t).rem;return {subject:'['+t.id+'] Target time at risk',body:'"'+t.svc.name+'" has about '+dur(r)+' of working time left (due '+fmtDT(t.due)+').\n'+(t.assignee?'Assigned to '+staffName(t.assignee)+'.':'It is still unassigned.')+SIG}},
 breach:function(t){var r=sla(t).rem;return {subject:'['+t.id+'] Target time missed',body:'"'+t.svc.name+'" passed its target time of '+fmtDT(t.due)+' by '+dur(-r)+'.\nPlease update the requester and decide whether to reassign or escalate.'+SIG}},
 longhold:function(t){return {subject:'['+t.id+'] On hold for '+dur(workBetween(t.holdStart,S.now)),body:'"'+t.svc.name+'" has been on hold since '+fmtDT(t.holdStart)+':\n\n"'+t.holdReason+'"\n\nFollow up with the requester or close the request.'+SIG}}
};
function ruleTo(r,t){var o=[];if(r.to.staff)o.push(t.assignee?staffName(t.assignee):'Coordinator');if(r.to.coord)o.push('Coordinator');if(r.to.head)o.push('Unit head');return o}
function recips(ev,t){var req=t.req.name,as=t.assignee?staffName(t.assignee):'Coordinator',co='Coordinator',R=S.rules;
  var m={submitted:[req,co],assigned:[as,req],started:[req],update:[req],hold:[req],reply:[as,co],resolved:[req,co],rated:[as,co],
    evalremind:[req],autoclosed:[req,co],unassigned:[co],unstarted:[as,co],risk:ruleTo(R.risk,t),breach:ruleTo(R.breach,t),longhold:[co,as]}[ev];
  return m.filter(function(x,i){return m.indexOf(x)===i})}
function notify(ev,t,when,extra){
  var cfg=S.settings[ev],ch=[];if(cfg.email)ch.push('Email');if(cfg.app)ch.push('In-app');if(!ch.length)return;
  var tp=TPL[ev](t,extra);
  var n={id:++S.nid,t:new Date(when||S.now),ev:ev,tid:t.id,ch:ch,to:recips(ev,t),subject:tp.subject,body:tp.body,read:false};
  S.notifs.push(n);
  if(ch.indexOf('In-app')>-1&&!S.quiet&&S.user&&(S.user.role==='coord'||n.to.indexOf(S.user.name)>-1||(S.user.role==='head'&&n.to.indexOf('Unit head')>-1)))toast(n);return n}
function fadeOut(el){el.classList.add('out');setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},180)}
function toast(n){var box=$('#toasts');if(!box)return;var el=document.createElement('div');el.className='toast';
  el.innerHTML=esc(n.subject)+'<small>In-app · to '+esc(n.to.join(', '))+'</small>';box.appendChild(el);
  while(box.children.length>3)box.removeChild(box.firstChild);
  setTimeout(function(){fadeOut(el)},4200)}

/* ---------- ticket logic ---------- */
function H(t,kind,text,by,note){var e={t:new Date(S.now),kind:kind,text:text,by:by||'System',note:note||''};t.hist.push(e);
  S.log.unshift({t:e.t,id:t.id,text:text+(note?': '+note:'')});if(S.log.length>30)S.log.pop()}
var who=function(by){return by||(S.user?S.user.name:'System')};
function sla(t){
  if(t.resolvedAt)return t.resolvedAt<=t.due?{k:'met',label:'On time'}:{k:'late',label:'Late'};
  if(t.status==='hold')return {k:'paused',label:'Paused'};
  var rem=workBetween(S.now,t.due);
  if(rem<0)return {k:'breach',rem:rem,label:'Overdue '+dur(-rem)};
  if(rem<=S.rules.risk.pct/100*t.sla*60)return {k:'risk',rem:rem,label:dur(rem)+' left'};
  return {k:'ok',rem:rem,label:dur(rem)+' left'}}
var heldNow=function(t){return t.status==='hold'&&t.holdStart?workBetween(t.holdStart,S.now):0};
function usedMins(t){var end=t.resolvedAt||S.now;return Math.max(0,workBetween(t.created,end)-t.heldTotal-heldNow(t))}
function openLoad(id){return S.tickets.filter(function(t){return t.assignee===id&&!t.resolvedAt}).length}
/* assignment: availability first, then function assignment, then expertise, then fewest open tasks */
function rank(t){
  return STAFF.map(function(s){
    var av=S.avail[s.id],load=openLoad(s.id),fn=s.fn.indexOf(t.svc.cat)>-1,sk=s.skills.indexOf(t.svc.cat)>-1;
    var score=(fn?30:0)+(sk?15:0)+(av==='available'?10:av==='busy'?0:-100)-load*4;
    var why=[AVAIL[av].toLowerCase()];
    if(fn)why.push('function match');else if(sk)why.push('expertise match');
    why.push(load+' open');
    return {s:s,score:score,av:av,why:why.join(' · ')}}).sort(function(a,b){return b.score-a.score})}
function suggest(t){return rank(t)[0].s}
function createTicket(o){
  var t=build({n:S.seq++,svc:o.svc,req:o.req,loc:o.loc,desc:o.desc,prio:o.prio,c:new Date(S.now),files:o.files,pref:o.pref});
  S.tickets.push(t);H(t,'status','Request submitted',t.req.name);notify('submitted',t);return t}
function assign(t,sid,by){if(t.status!=='new'&&t.status!=='assigned')return;var re=t.assignee&&t.assignee!==sid;
  t.assignee=sid;t.status='assigned';t.assignedAt=new Date(S.now);t.nsSent=false;H(t,'assign',(re?'Reassigned to ':'Assigned to ')+staffName(sid),who(by));notify('assigned',t)}
function start(t,by){if(t.status!=='assigned')return;t.status='progress';t.startedAt=new Date(S.now);t.quick=workBetween(t.assignedAt,S.now)<=60;
  if(!t.target)t.target=r15(t.sla*60*(0.3+Math.random()*0.8));H(t,'status','Work started',who(by));notify('started',t)}
function update(t,note,by){if(t.status!=='progress'&&t.status!=='hold')return;H(t,'update','Update posted',who(by),note);notify('update',t,null,note)}
function hold(t,note,by){if(t.status!=='progress')return;t.status='hold';t.holdStart=new Date(S.now);t.holdReason=note;t.lhSent=false;
  H(t,'hold','Put on hold. Time tracker paused',who(by),note);notify('hold',t)}
function resume(t,note,by){if(t.status!=='hold')return;var lost=workBetween(t.holdStart,S.now);t.heldTotal+=lost;if(lost>0)t.due=addWork(t.due,lost);
  t.status='progress';t.holdStart=null;t.simHold=false;
  H(t,'resume','Resumed. Time tracker running again'+(lost?' ('+dur(lost)+' on hold, target moved to '+fmtDT(t.due)+')':''),who(by),note)}
function resolve(t,note,by){if(t.status!=='progress')return;t.status='resolved';t.resolvedAt=new Date(S.now);evalDates(t);H(t,'done','Marked as completed',who(by),note);notify('resolved',t)}
function message(t,text,by){if(t.resolvedAt)return;H(t,'reply',t.status==='hold'?'Reply to the hold request':'Message to the office',who(by),text);notify('reply',t,null,text)}
function rate(t,r,comment,by){if(t.status!=='resolved')return;
  t.ratings=r;t.rating=Math.round((r.q+r.p+r.e)/3*10)/10;t.comment=comment||'';t.status='closed';t.closedAt=new Date(S.now);
  H(t,'rating','Evaluated: quality '+r.q+', punctuality '+r.p+', expertise '+r.e+' (average '+t.rating.toFixed(1)+')',who(by),t.comment);notify('rated',t)}
function checkSla(){var R=S.rules;S.tickets.forEach(function(t){
  if(t.resolvedAt)return;
  if(R.unassigned.on&&t.status==='new'&&!t.unSent&&workBetween(t.created,S.now)>=R.unassigned.min){t.unSent=true;notify('unassigned',t)}
  if(R.unstarted.on&&t.status==='assigned'&&!t.nsSent&&workBetween(t.assignedAt,S.now)>=R.unstarted.min){t.nsSent=true;notify('unstarted',t)}
  if(t.status==='hold'){
    if(R.longhold.on&&!t.lhSent&&workBetween(t.holdStart,S.now)>=R.longhold.hours*60){t.lhSent=true;notify('longhold',t)}
    return}
  var k=sla(t).k;
  if(R.risk.on&&k==='risk'&&!t.riskSent){t.riskSent=true;notify('risk',t)}
  if(k==='breach'){
    if(!t.breachSent){t.breachSent=true;t.riskSent=true;t.lastBreach=new Date(S.now);H(t,'alert','Target time missed','System');if(R.breach.on)notify('breach',t)}
    else if(R.breach.on&&R.breach.repeat>0&&workBetween(t.lastBreach,S.now)>=R.breach.repeat){t.lastBreach=new Date(S.now);notify('breach',t)}}})}

/* ---------- scoring ---------- */
function stats(id){
  var mine=S.tickets.filter(function(t){return t.assignee===id}),done=mine.filter(function(t){return t.resolvedAt}),open=mine.filter(function(t){return !t.resolvedAt});
  var rated=done.filter(function(t){return t.ratings}),started=mine.filter(function(t){return t.quick!==null});
  var onTime=done.filter(function(t){return t.resolvedAt<=t.due}).length;
  var avg=function(a){return a.length?a.reduce(function(x,y){return x+y},0)/a.length:null};
  return {assigned:mine.length,done:done.length,open:open.length,onTime:onTime,late:done.length-onTime,
    delayed:open.filter(function(t){return t.status!=='hold'&&sla(t).k==='breach'}).length,hold:open.filter(function(t){return t.status==='hold'}).length,
    sla:done.length?onTime/done.length*100:null,rating:avg(rated.map(function(t){return t.rating})),
    q:avg(rated.map(function(t){return t.ratings.q})),p:avg(rated.map(function(t){return t.ratings.p})),e:avg(rated.map(function(t){return t.ratings.e})),
    time:avg(done.map(tcomp)),evals:rated.length,noEval:done.filter(function(t){return t.autoClosed}).length,pendEval:done.filter(function(t){return t.status==='resolved'}).length,
    quick:started.length?started.filter(function(t){return t.quick}).length/started.length*100:null}}
function scoreOf(st,maxDone){
  var parts=[[st.sla,.4],[st.rating==null?null:st.rating/5*100,.3],[st.done?st.done/Math.max(1,maxDone)*100:null,.2],[st.quick,.1]].filter(function(p){return p[0]!=null});
  if(!parts.length)return null;var w=parts.reduce(function(a,p){return a+p[1]},0);
  return Math.round(parts.reduce(function(a,p){return a+p[0]*p[1]},0)/w)}

function colOf(t){return t.resolvedAt?'done':t.status}
function quick(t){var c=isCoord(),m=myStaff()===t.assignee;
  if(t.status==='new'&&c)return {act:'qassign',label:'Assign to '+suggest(t).short};
  if(t.status==='assigned'&&(c||m))return {act:'start',label:'Start work'};
  if(t.status==='hold'&&(c||m))return {act:'resume',label:'Resume'};
  if(t.status==='resolved'&&isOwner(t))return {act:'open',label:'Evaluate'};
  return null}
function card(t){
  var k=sla(t),q=quick(t);
  var foot=t.resolvedAt?(t.rating?'<span class="stars">'+IC.star(true,13)+t.rating.toFixed(1)+'</span>':t.autoClosed?'<span class="chip">Closed without evaluation</span>':'<span class="chip'+(t.remSent?' risk':'')+'">Evaluation closes '+fmtD(t.evalDue)+'</span>'):'';
  return '<article class="card" tabindex="0" role="button" data-open="'+t.id+'" aria-label="Open '+t.id+'">'+
   '<div class="c-top"><span class="tid">'+t.id+'</span><span class="prio p-'+t.prio.toLowerCase()+'">'+t.prio+'</span></div>'+
   '<div class="c-title">'+esc(t.svc.name)+'</div>'+
   '<div class="c-meta">'+esc(t.req.name)+' · '+esc(t.req.dept)+'</div>'+
   (t.status==='hold'?'<div class="c-meta">On hold: '+esc(t.holdReason)+'</div>':'')+
   '<div class="c-foot">'+avatar(t.assignee)+foot+'<span class="chip '+k.k+'">'+k.label+'</span></div>'+
   (q?'<button class="btn small c-act" data-act="'+q.act+'" data-id="'+t.id+'">'+q.label+'</button>':'')+'</article>'}
function kpi(l,n,s,c,x){return '<div class="kpi"><span class="k-l">'+l+'</span><b class="k-n '+(c||'')+'">'+n+'</b><span class="k-s">'+s+'</span>'+(x?'<span class="k-s">'+x+'</span>':'')+'</div>'}
function renderBoard(){
  var T=visibleTickets(),open=T.filter(function(t){return !t.resolvedAt}),done=T.filter(function(t){return t.resolvedAt});
  var att=open.filter(function(t){var k=sla(t).k;return k==='risk'||k==='breach'}).length;
  var met=done.filter(function(t){return t.resolvedAt<=t.due}).length;
  var rated=T.filter(function(t){return t.rating});
  var ar=rated.length?rated.reduce(function(a,t){return a+t.rating},0)/rated.length:null;
  var at=done.length?done.reduce(function(a,t){return a+tcomp(t)},0)/done.length:null;
  $('#kpis').innerHTML=
   kpi('Open tickets',open.length,open.filter(function(t){return t.status==='new'}).length+' waiting for assignment')+
   kpi('Needs attention',att,'at risk or overdue',att?(open.some(function(t){return sla(t).k==='breach'})?'crit':'warn'):'')+
   kpi('Completed on time',done.length?Math.round(met/done.length*100)+'%':'-',met+' of '+done.length+' completed')+
   kpi('Average evaluation',ar==null?'-':ar.toFixed(1),'from '+rated.length+' evaluations')+
   kpi('Average time to finish',at==null?'-':dur(at),'working time, holds excluded');
  var f=S.filter,q=f.q.toLowerCase();
  var list=T.filter(function(t){
    if(q&&(t.id+' '+t.svc.name+' '+t.req.name).toLowerCase().indexOf(q)<0)return false;
    if(f.who==='none'&&t.assignee)return false;if(f.who!=='all'&&f.who!=='none'&&t.assignee!==f.who)return false;
    if(f.prio!=='all'&&t.prio!==f.prio)return false;return true});
  var colsEl=$('#cols');colsEl.classList.toggle('stag',!!S.stag);if(S.stag){S.stag=false;clearTimeout(renderBoard.t);renderBoard.t=setTimeout(function(){colsEl.classList.remove('stag')},700)}
  colsEl.innerHTML=COLS.map(function(c){
    var items=list.filter(function(t){return colOf(t)===c[0]});
    if(c[0]==='done')items.sort(function(a,b){return b.resolvedAt-a.resolvedAt});else items.sort(function(a,b){return a.due-b.due});
    var shown=c[0]==='done'?items.slice(0,6):items;
    return '<section class="col" aria-label="'+c[1]+'"><header><h3>'+c[1]+'</h3><span class="n">'+items.length+'</span></header>'+
      (shown.length?shown.map(card).join(''):'<p class="empty">Nothing here</p>')+
      (items.length>shown.length?'<p class="more"><button class="lnk" data-act="gohist" data-v="done">+'+(items.length-shown.length)+' earlier, see all</button></p>':'')+'</section>'}).join('');
  var ids={};T.forEach(function(t){ids[t.id]=1});
  var feed=S.log.filter(function(e){return ids[e.id]}).slice(0,10);
  $('#feed').innerHTML=feed.map(function(e){return '<li><time>'+fmtD(e.t).split(' ').slice(1).join(' ')+' '+fmtT(e.t)+'</time><span><b class="mono">'+e.id.slice(-4)+'</b> '+esc(e.text)+'</span></li>'}).join('')||'<li><span class="muted">Activity appears here as tickets move.</span></li>'}

/* ---------- drawer ---------- */
function draftFor(t){if(S.draft.tid!==t.id)S.draft=Object.assign(emptyDraft(),{tid:t.id});return S.draft}
function openDrawer(id){S.sel=id;renderDrawer(true);var b=$('#drawer .xbtn');if(b)b.focus({preventScroll:true})}
function closeDrawer(){S.sel=null;var d=$('#drawer'),sc=$('#scrim');if(d.hidden)return;d.classList.remove('open');sc.classList.remove('open');clearTimeout(closeDrawer.t);closeDrawer.t=setTimeout(function(){if(!S.sel){d.hidden=true;sc.hidden=true}},230)}

     '<label class="fld"><span class="lab">Comment (optional)</span><textarea id="dr-comment" placeholder="Anything the office should know?">'+esc(dr.comment)+'</textarea></label>'+
     '<p class="err" role="alert">'+(dr.err?'Choose 1 to 5 stars for quality, punctuality, and expertise.':'')+'</p>'+

  else if(st==='resolved')ev='<div class="d-sec"><h3>Evaluation</h3><p class="note">Waiting for the requester to evaluate the service. It closes automatically on '+fmtDT(t.evalDue)+(t.remSent?'. A reminder was sent.':'. A reminder goes out on '+fmtDT(t.remindAt)+'.')+'</p></div>';
  else if(st==='closed'&&t.autoClosed)ev='<div class="d-sec"><h3>Evaluation</h3><p class="note">Closed without an evaluation on '+fmtDT(t.closedAt)+'. The requester did not respond within '+t.evalDays+' working days, so no ratings were recorded.</p></div>';
  else if(st==='closed'&&t.ratings)ev='<div class="d-sec"><h3>Evaluation</h3>'+[['Quality',t.ratings.q],['Punctuality',t.ratings.p],['Expertise',t.ratings.e]].map(function(r){return '<div class="evrow"><span class="lab">'+r[0]+'</span><span class="stars">'+starRow(r[1],18)+'</span></div>'}).join('')+
    '<p class="note">Average '+t.rating.toFixed(1)+' of 5</p>'+(t.comment?'<span class="rm">'+esc(t.comment)+'</span>':'')+'</div>';

  var prevSec='';
  if(!owner){var pv=S.tickets.filter(function(x){return x.req.email===t.req.email&&x.id!==t.id}).sort(function(a,b){return b.created-a.created});
    if(pv.length)prevSec='<div class="d-sec"><h3>Earlier requests from '+esc(t.req.name)+'</h3>'+pv.slice(0,4).map(mi).join('')+'<p class="note" style="margin-top:6px"><button class="lnk" data-act="histfor" data-v="'+esc(t.req.email)+'">See all '+pv.length+' in All requests</button></p></div>'}
  var hist=t.hist.slice().sort(function(x,y){return x.t-y.t});
  d.innerHTML='<div class="d-head"><div><span class="tid">'+t.id+'</span><h2>'+esc(t.svc.name)+'</h2></div><button class="btn small xbtn" data-act="close" aria-label="Close">'+IC.close+'</button></div>'+
   '<div class="d-chips"><span class="st" style="--c:var('+STC[st]+')">'+STL[st]+'</span><span class="prio p-'+t.prio.toLowerCase()+'">'+t.prio+'</span><span class="chip '+k.k+'">'+k.label+'</span></div>'+trk+
   '<div class="d-sec"><h3>Details</h3><dl class="kv"><dt>Requester</dt><dd>'+esc(t.req.name)+'<br><span class="muted">'+esc(t.req.role)+', '+esc(t.req.dept)+'</span></dd>'+
   '<dt>Email</dt><dd class="mono">'+esc(t.req.email)+'</dd><dt>Location</dt><dd>'+esc(t.loc||'Not given')+'</dd>'+
   '<dt>Requested</dt><dd>'+fmtDT(t.created)+'</dd>'+
   '<dt>Assigned to</dt><dd class="inline">'+avatar(t.assignee)+esc(staffName(t.assignee))+'</dd>'+
   (t.pref?'<dt>Needed by</dt><dd>'+esc(t.pref)+'</dd>':'')+(t.files.length?'<dt>Files</dt><dd>'+t.files.map(esc).join(', ')+'</dd>':'')+
   '<dt>Details</dt><dd>'+esc(t.desc||'No description')+'</dd></dl></div>'+

   '<div class="d-sec"><h3>Timeline</h3><ul class="tl">'+hist.map(function(h){return '<li class="k-'+h.kind+'"><time>'+fmtDT(h.t)+'</time><div><span class="kind">'+KL[h.kind]+'</span>'+esc(h.text)+(h.note?'<span class="rm">'+esc(h.note)+'</span>':'')+'<span class="by">by '+esc(h.by)+'</span></div></li>'}).join('')+'</ul></div>';
  var wasHidden=d.hidden;d.hidden=false;$('#scrim').hidden=false;if(wasHidden)void d.offsetWidth;d.classList.add('open');$('#scrim').classList.add('open')}

/* ---------- request form ---------- */
var lastSample='';

  var groups=Object.keys(CATS).map(function(c){var items=CATALOG.filter(function(s){return s.cat===c});if(!items.length)return '';
    return '<h3 class="grp">'+CATS[c]+'</h3>'+items.map(function(s){return '<label class="svc"><input type="radio" name="svc" value="'+s.id+'"'+(s.id==='print'?' checked':'')+'><span class="svc-b"><b>'+s.name+'</b><small>Target '+dur(s.sla*60)+' working time</small></span></label>'}).join('')}).join('');

function applyUserToForm(){
  var u=S.user,req=u.role==='requester'||u.role==='head',r=u.req||REQS[0];
  $('#form-ok').hidden=true;
  $('#f-lede').textContent=req?'You are signed in, so your details are filled in. Choose a service, describe what you need, and submit. The target time starts when you submit.':'Log a request for someone who called or walked in. Edit the requester details, choose a service, and submit.';
  $('#f-acct').textContent=req?'Your name, email, role, and department come from your account.':'Sample requester details are filled in so you can submit right away.';
  $('#f-name').value=r.name;$('#f-email').value=r.email;$('#f-role').value=r.role;$('#f-dept').value=r.dept;
  $('#f-name').readOnly=req;$('#f-email').readOnly=req;$('#f-role').disabled=req;$('#f-dept').disabled=req;
  ['f-name','f-email','f-desc'].forEach(function(i){$('#'+i).removeAttribute('aria-invalid')});
  ['e-name','e-email','e-desc'].forEach(function(i){$('#'+i).textContent=''});

function curSvc(){var r=$('input[name=svc]:checked');return CATALOG.filter(function(c){return c.id===(r?r.value:'print')})[0]}
function updateSum(){var s=curSvc(),p=$('#f-prio').value,h=slaFor(s,p),due=addWork(S.now,h*60);
  $('#svc-sum').innerHTML='<b class="t">'+s.name+'</b><p>'+s.desc+'</p><p class="muted"><b style="font:600 13px var(--f-body)">Please include:</b> '+s.info+'</p><p class="mono" style="font-size:12.5px">Target '+dur(h*60)+' working time · due '+fmtDT(due)+'</p>'}
function onServiceChange(){var s=curSvc();$('#f-prio').value=s.prio;
  var dd=$('#f-desc');if(dd.value===lastSample||!dd.value.trim()){lastSample=DESCS[s.id][0];dd.value=lastSample}
  updateSum()}
function submitForm(e){
  e.preventDefault();if(!S.user)return;var ok=true;
  function chk(id,eid,bad,msg){var el=$('#'+id);if(bad){el.setAttribute('aria-invalid','true');$('#'+eid).textContent=msg;ok=false}else{el.removeAttribute('aria-invalid');$('#'+eid).textContent=''}}
  var name=$('#f-name').value.trim(),email=$('#f-email').value.trim(),desc=$('#f-desc').value.trim();
  chk('f-name','e-name',name.length<3,'Enter the requester\'s full name.');
  chk('f-email','e-email',!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email),'Enter a valid email address so we can reach the requester.');
  chk('f-desc','e-desc',desc.length<10,'Describe the request in at least a sentence.');
  if(!ok)return;
  var files=$('#f-file').files,names=[];for(var i=0;i<files.length;i++)names.push(files[i].name);
  var t=createTicket({svc:curSvc().id,req:{name:name,role:$('#f-role').value,dept:$('#f-dept').value,email:email},loc:$('#f-loc').value.trim(),desc:desc,prio:$('#f-prio').value,files:names,pref:$('#f-date').value});
  var box=$('#form-ok');box.hidden=false;
  box.innerHTML='<div class="ok-card"><h3>Request '+t.id+' submitted</h3><p>Target completion: <b>'+fmtDT(t.due)+'</b>. A confirmation was sent to '+esc(email)+' (see Notifications) and the office coordinator can now assign an assistant.</p><div class="inline"><button class="btn primary small" data-open="'+t.id+'">Open request</button><button class="btn small" data-tab="board">Go to '+(S.user.role==='requester'?'my requests':'the board')+'</button></div></div>';
  box.scrollIntoView({block:'nearest'});render(true)}

/* ---------- monitoring / scoreboard ---------- */
function busy(sel){var a=document.activeElement;return !!(a&&/^(SELECT|INPUT|TEXTAREA)$/.test(a.tagName)&&a.closest&&a.closest(sel))}
function mi(t){var k=sla(t);return '<button class="mi" data-open="'+t.id+'"><span class="tid">'+t.id.slice(-4)+'</span><span class="mi-t">'+esc(t.svc.name)+'</span><span class="mi-f"><span class="st" style="--c:var('+STC[t.status]+')">'+STL[t.status]+'</span><span class="chip '+k.k+'">'+k.label+'</span></span></button>'}
function tcomp(t){return Math.max(0,workBetween(t.created,t.resolvedAt)-t.heldTotal)}
var avgOf=function(a){return a.length?a.reduce(function(x,y){return x+y},0)/a.length:null};
var pctOf=function(n,d){return d?Math.round(n/d*100)+'%':'-'};
function lnk(t){return '<button class="lnk" data-open="'+t.id+'">'+t.id.slice(-4)+'</button>'}
function renderScore(force){
  if(!force&&(busy('#p-score')||document.querySelector('#p-score .cz:hover')))return;
  var coord=canMon(),view=coord?S.mon:'perf';
  var head='<h2>'+(coord?'Monitoring':'Scoreboard')+'</h2>'+(coord?'<div class="subnav" role="tablist" aria-label="Monitoring views">'+[['tasks','Tasks'],['perf','Staff performance']].map(function(x){return '<button role="tab" data-act="montab" data-v="'+x[0]+'" aria-selected="'+(view===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>':'');
  $('#p-score').innerHTML=head+(view==='tasks'?tasksView():perfView())}

function tasksView(){
  var allR={s:new Date(2000,0,1),e:S.now,label:'All requests'},ra=reportData(allR),cw=czW();
  var T=S.tickets,open=T.filter(function(t){return !t.resolvedAt}),done=T.filter(function(t){return t.resolvedAt});
  var onT=done.filter(function(t){return t.resolvedAt<=t.due}).length;
  var delayed=open.filter(function(t){return t.status!=='hold'&&sla(t).k==='breach'});
  var avgT=avgOf(done.map(tcomp)),avgTg=avgOf(done.map(function(t){return t.sla*60}));
  var pend=T.filter(function(t){return t.status==='resolved'}),auto=T.filter(function(t){return t.autoClosed});
  var kp='<div class="kpis">'+kpi('Open now',open.length,open.filter(function(t){return t.status==='new'}).length+' not yet assigned')+
    kpi('Completed',done.length,onT+' on time · '+(done.length-onT)+' late')+
    kpi('Average time to complete',avgT==null?'-':dur(avgT),avgTg==null?'working time':'average target '+dur(avgTg))+
    kpi('Delayed now',delayed.length,'open and past the target time',delayed.length?'crit':'')+
    kpi('Awaiting evaluation',pend.length,pend.filter(function(t){return t.remSent}).length+' reminded · '+auto.length+' closed without one')+'</div>';

  /* status */
  var cnt={new:0,assigned:0,progress:0,hold:0,resolved:0,closed:0};T.forEach(function(t){cnt[t.status]++});
  var SR=[['new','New','--st-new'],['assigned','Assigned','--st-assigned'],['progress','In progress','--st-progress'],['hold','On hold','--st-hold'],['resolved','Completed, awaiting evaluation','--good'],['closed','Completed and closed','--st-done']];
  var tot=Math.max(1,T.length);

function evalDates(t){if(!t.resolvedAt)return;var days=S.evalCfg.days,rm=Math.min(S.evalCfg.remind,days-1);
  t.evalDays=days;t.evalDue=addWork(t.resolvedAt,days*540);t.remindAt=addWork(t.resolvedAt,(days-rm)*540)}
function recalcDue(){var n=0;S.tickets.forEach(function(t){
  if(!t.resolvedAt){var d=addWork(t.created,t.sla*60+t.heldTotal);if(+d!==+t.due){t.due=d;n++}}
  else if(t.status==='resolved')evalDates(t)});return n}
function checkEval(){S.tickets.forEach(function(t){
  if(t.status!=='resolved')return;
  if(!t.evalDue)evalDates(t);
  if(S.now>=t.evalDue){t.status='closed';t.autoClosed=true;t.closedAt=new Date(S.now);t.remSent=true;
    H(t,'rating','Evaluation closed automatically. No response within '+t.evalDays+' working days','System');notify('autoclosed',t);return}
  if(!t.remSent&&S.now>=t.remindAt){t.remSent=true;H(t,'remind','Reminder sent. The evaluation closes '+fmtDT(t.evalDue),'System');if(S.quiet)t.hist[t.hist.length-1].t=new Date(t.remindAt);notify('evalremind',t,S.quiet?t.remindAt:null)}})}

var HSTAT=[['all','Any status'],['open','Open (not completed)'],['new','New'],['assigned','Assigned'],['progress','In progress'],['hold','On hold'],['done','Completed (any)'],['resolved','Completed, awaiting evaluation'],['closed','Completed and closed']];
var HOUT=[['all','Any result'],['ontime','Completed on time'],['late','Completed late'],['overdue','Open and overdue'],['evaluated','Evaluated'],['noeval','Closed without evaluation']];
function histMatch(t){var f=S.hf;
  if(f.q&&(t.id+' '+t.svc.name+' '+t.req.name+' '+t.req.email+' '+t.req.dept+' '+t.desc).toLowerCase().indexOf(f.q.toLowerCase())<0)return false;
  if(f.status==='open'){if(t.resolvedAt)return false}else if(f.status==='done'){if(!t.resolvedAt)return false}else if(f.status!=='all'&&t.status!==f.status)return false;
  if(f.svc!=='all'&&t.svc.id!==f.svc)return false;
  if(f.who==='none'){if(t.assignee)return false}else if(f.who!=='all'&&t.assignee!==f.who)return false;
  var o=f.out;
  if(o==='ontime'&&!(t.resolvedAt&&t.resolvedAt<=t.due))return false;
  if(o==='late'&&!(t.resolvedAt&&t.resolvedAt>t.due))return false;
  if(o==='overdue'&&!(!t.resolvedAt&&t.status!=='hold'&&sla(t).k==='breach'))return false;
  if(o==='evaluated'&&!t.ratings)return false;
  if(o==='noeval'&&!t.autoClosed)return false;
  if(f.from&&t.created<parseKey(f.from))return false;
  if(f.to){var e=parseKey(f.to);e.setDate(e.getDate()+1);if(t.created>=e)return false}
  return true}

/* ---------- simulation ---------- */
function advance(m){S.now=norm(addWork(S.now,m))}
function simRate(t){var late=t.resolvedAt>t.due;rate(t,{q:rnd([3,4,4,5,5]),p:late?rnd([1,2,2,3]):rnd([4,5,5]),e:rnd([3,4,4,5,5])},'',t.req.name)}
function simTick(){
  if(!S.user)return;
  advance(15);
  if(Math.random()<0.38){var svc=rnd(CATALOG);createTicket({svc:svc.id,req:Math.random()<0.1?HEAD:rnd(REQS),loc:rnd(LOCS),desc:rnd(DESCS[svc.id]),prio:Math.random()<0.08?'Urgent':svc.prio})}
  var snap=S.tickets.map(function(t){return [t,t.status]});
  var fresh=snap.filter(function(p){return p[1]==='new'}).map(function(p){return p[0]}).sort(function(a,b){return a.created-b.created})[0];
  if(fresh&&Math.random()<0.75){var top=rank(fresh)[0];if(top.av!=='leave')assign(fresh,top.s.id,COORD)}
  snap.forEach(function(p){var t=p[0],st=p[1],sn=t.assignee?staffName(t.assignee):null;
    if(st==='assigned'&&Math.random()<0.55)start(t,sn);
    else if(st==='progress'){t.work+=15;
      if(!t.heldOnce&&Math.random()<0.06){t.heldOnce=true;t.holdTicks=2+Math.floor(Math.random()*3);hold(t,rnd(HOLD_PICKS),sn);t.simHold=true}
      else if(t.work>=t.target)resolve(t,rnd(NOTES),sn);
      else if(Math.random()<0.08)update(t,rnd(UPDS),sn)}
    else if(st==='hold'&&t.simHold){t.holdTicks--;if(t.holdTicks<=0){message(t,'Here is what you asked for. Please continue.',t.req.name);resume(t,'Received the details from the requester',sn)}}
    else if(st==='resolved'){t.waitTicks++;
      if(isOwner(t)||t.status!=='resolved')return;
      if(t.noReply===null)t.noReply=Math.random()<0.3;
      if(!t.noReply&&t.waitTicks>=2&&Math.random()<0.5)simRate(t)}});
  checkSla();checkEval();render()}
function setSim(on){S.sim.on=on;clearInterval(S.sim.timer);if(on)S.sim.timer=setInterval(simTick,Math.round(1000/S.sim.speed));updateSim()}

function setTab(id){
  if(!allowed(id)||!document.getElementById('p-'+id))return;S.tab=id;S.stag=true;
  $$('.panel').forEach(function(p){p.hidden=p.id!=='p-'+id});
  $$('.tab').forEach(function(b){b.setAttribute('aria-selected',String(b.dataset.tab===id))});
  try{history.replaceState(null,'','#'+id)}catch(e){}
  render(true);tabFade()}
function render(force){
  if(!S.user)return;
  if(down&&!force)return;
  updateSim();
  if(S.tab==='board')renderBoard();
  if(S.tab==='score')renderScore(force);
  if(S.tab==='hist')renderHist();
  if(S.tab==='rep')renderReport(force);
  if(S.tab==='notif')renderNotif(force);
  if(S.tab==='set'&&force)renderSettings();
  if(S.sel)renderDrawer(force)}
function takeRem(t,need,id){
  var el=S.sel===t.id?$('#'+id):null,txt=((el?el.value:'')||(S.rem.tid===t.id?S.rem.text:'')).trim();
  if(!txt&&need){S.rem={tid:t.id,text:'',err:need};renderDrawer(true);return null}
  return txt}
function clearRem(){S.rem={tid:'',text:'',err:''}}
function act(a,id,v,el){
  var t=id?byId(id):null,me=S.user?S.user.name:'';
  switch(a){
    case 'fillacc':$('#l-email').value=v;$('#l-pass').value=PASSWORD;$('#l-err').textContent='';$('#l-email').removeAttribute('aria-invalid');$('#loginform button[type=submit]').focus();return;
    case 'logout':logout();return;
    case 'simtoggle':setSim(!S.sim.on);return;
    case 'simstep':simTick();return;
    case 'simreset':setSim(false);closeDrawer();init();applyUserToBoard();render(true);return;
    case 'qassign':if(!isCoord())return;assign(t,suggest(t).id,me);break;
    case 'assign':if(!isCoord())return;assign(t,$('#dr-assign').value,me);break;
    case 'start':if(!canAct(t))return;start(t,me);break;
    case 'update':{if(!canAct(t))return;var u=takeRem(t,'Add a remark so the requester can see what changed.','dr-rem');if(u===null)return;update(t,u,me);clearRem();break}
    case 'hold':{if(!canAct(t))return;var h=takeRem(t,'Add the reason for the hold. The requester will see it.','dr-rem');if(h===null)return;hold(t,h,me);clearRem();break}
    case 'resume':{if(!canAct(t))return;var r=takeRem(t,'','dr-rem');resume(t,r||'',me);clearRem();break}
    case 'resolve':{if(!canAct(t))return;var c=takeRem(t,'','dr-rem');resolve(t,c||'Completed',me);clearRem();break}
    case 'send':{if(!isOwner(t))return;var m=takeRem(t,'Write a message first.','dr-msg');if(m===null)return;message(t,m,me);clearRem();break}
    case 'pick':{var ta=$('#dr-rem');if(ta){ta.value=v;S.rem={tid:S.sel,text:v,err:''};ta.focus()}return}
    case 'rate1':{if(!isOwner(t))return;var dr=draftFor(t);dr[el.dataset.k]=+v;dr.err=false;break}
    case 'submitrate':{if(!isOwner(t))return;var d2=draftFor(t);if(!d2.q||!d2.p||!d2.e){d2.err=true;break}
      rate(t,{q:d2.q,p:d2.p,e:d2.e},d2.comment.trim(),me);S.draft=emptyDraft();break}
    case 'montab':if(!canMon())return;S.mon=v;break;
    case 'caladd':{if(!isCoord())return;
      var cf=$('#cal-from').value,ct=$('#cal-to').value,cn=$('#cal-name').value.trim(),ck=$('#cal-kind').value,cerr='';
      S.calDraft={from:cf,to:ct,name:cn,kind:ck};
      if(!cf)cerr='Choose the date.';
      else if(ct&&ct<cf)cerr='The end date is before the start date.';
      else if(!cn)cerr='Give it a name so people know why the office is closed.';
      else{var ca=parseKey(cf),cb=parseKey(ct||cf),cadd=0;
        if((cb-ca)/86400000>60)cerr='Add at most 60 days at a time.';
        else{for(var cd=new Date(ca);cd<=cb;cd.setDate(cd.getDate()+1)){
          if(cd.getDay()===0||cd.getDay()===6||CLOSED[dkey(cd)])continue;
          S.cal.push({key:dkey(cd),name:cn,kind:ck});cadd++}
          if(!cadd)cerr='Those dates are weekends or are already in the calendar.'}}
      if(cerr){S.calErr=cerr;S.calMsg='';break}
      S.cal.sort(function(x,y){return x.key<y.key?-1:1});S.calDraft=null;
      calChanged('Added '+cadd+' day'+(cadd>1?'s':'')+' to the calendar.');break}
    case 'caldel':{if(!isCoord())return;S.cal=S.cal.filter(function(c){return c.key!==v});calChanged('Removed from the calendar.');break}
    case 'gohist':S.hf=hfDefault();S.hf.status=v||'all';syncHist();setTab('hist');return;
    case 'histfor':S.hf=hfDefault();S.hf.q=v||'';syncHist();closeDrawer();setTab('hist');return;
    case 'histmore':S.hf.n+=25;renderHist();return;
    case 'histreset':S.hf=hfDefault();syncHist();renderHist();return;
    case 'dl':{var dl=v==='rep'?csvOf(reportTickets(reportData())):csvOf(histList());saveFile((v==='rep'?'ccs-report-requests-':'ccs-requests-')+dkey(S.now)+'.csv',dl);return}
    case 'dlsum':saveFile('ccs-report-'+dkey(S.now)+'.html',reportHtml(reportData()));return;
    case 'copysum':copyText(reportText(reportData()));return;
    case 'close':closeDrawer();return;
    case 'readall':myNotifs().forEach(function(n){n.read=true});break;
    case 'nsel':S.selN=+id;S.notifs.forEach(function(n){if(n.id===+id)n.read=true});break;
    case 'nfilter':S.nfilter=v;break;
    case 'open':openDrawer(id);return}
  render(true)}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act],[data-open],[data-tab]');if(!el)return;
  if(el.dataset.act){act(el.dataset.act,el.dataset.id,el.dataset.v,el);e.stopPropagation();return}
  if(el.dataset.tab){setTab(el.dataset.tab);return}
  if(el.dataset.open)openDrawer(el.dataset.open)});
document.addEventListener('pointerdown',function(){down=true},true);
['pointerup','pointercancel'].forEach(function(n){document.addEventListener(n,function(){setTimeout(function(){down=false},0)},true)});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&S.sel){closeDrawer();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.card[data-open]')){e.preventDefault();openDrawer(e.target.dataset.open)}});
document.addEventListener('change',function(e){
  var el=e.target,ds=el.dataset||{};
  if(el.id==='speed'){S.sim.speed=+el.value;if(S.sim.on)setSim(true)}
  else if(el.id&&el.id.indexOf('hf-')===0){S.hf[el.id.slice(3)]=el.value;S.hf.n=25;renderHist()}
  else if(el.id==='rp-kind'){S.rp.kind=el.value;renderReport(true)}
  else if(el.id==='rp-from'||el.id==='rp-to'){S.rp[el.id.slice(3)]=el.value;renderReport(true)}
  else if(el.id==='fw'){S.filter.who=el.value;renderBoard()}
  else if(el.id==='fp'){S.filter.prio=el.value;renderBoard()}
  else if(el.name==='svc')onServiceChange();
  else if(el.id==='f-prio')updateSum();
  else if(ds.avail){S.avail[ds.avail]=el.value;render(true)}
  else if(ds.rule){var r=S.rules[ds.rule];if(ds.to)r.to[ds.to]=el.checked;else if(el.type==='checkbox')r[ds.f]=el.checked;else r[ds.f]=+el.value}
  else if(ds.set)S.settings[ds.set][ds.ch]=el.checked
  else if(ds.goal){S.goal=+el.value;render(true)}
  else if(ds.ecfg){S.evalCfg[ds.ecfg]=+el.value;S.evalCfg.remind=Math.min(S.evalCfg.remind,S.evalCfg.days-1);recalcDue();checkEval();render(true)}});
document.addEventListener('input',function(e){var el=e.target;
  if(el.id==='q'){S.filter.q=el.value;renderBoard()}
  else if(el.id==='hf-q'){S.hf.q=el.value;S.hf.n=25;renderHist()}
  else if(el.id==='dr-rem'||el.id==='dr-msg'){S.rem={tid:S.sel,text:el.value,err:''}}
  else if(el.id==='dr-comment'&&S.sel){draftFor(byId(S.sel)).comment=el.value}});
document.addEventListener('submit',function(e){if(e.target.id==='reqform')submitForm(e);else if(e.target.id==='loginform')submitLogin(e)});
window.addEventListener('hashchange',function(){var h=(location.hash||'').replace('#','');if(S.user&&allowed(h)&&h!==S.tab)setTab(h)});

var czs=document.createElement('style');czs.textContent=CZ_CSS;document.head.appendChild(czs);tipEl=$('#tip');
document.addEventListener('pointermove',function(e){var el=e.target.closest&&e.target.closest('[data-tip]');if(!el){tipHide();return}tipFill(el);tipPos(e.clientX+14,e.clientY+14)});
document.addEventListener('focusin',function(e){var el=e.target.closest&&e.target.closest('[data-tip]');if(!el)return;tipFill(el);var b=el.getBoundingClientRect();tipPos(b.left+b.width/2,b.top)});
document.addEventListener('focusout',tipHide);window.addEventListener('blur',tipHide);window.addEventListener('scroll',tipHide,true);
function tabFade(){var t=$('#tabs');if(t)t.classList.toggle('more',t.scrollWidth-t.clientWidth-t.scrollLeft>4)}
(function(){var t=$('#tabs');if(t)t.addEventListener('scroll',tabFade,{passive:true});window.addEventListener('resize',tabFade)})();
var rz=null;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(function(){if(S.user&&(S.tab==='rep'||S.tab==='score'))render(true)},150)});
init();buildHeader();buildLogin();buildBoard();buildHist();buildRep();buildForm();buildFlow();buildPlan();buildVer();
showApp(false);updateSim();
try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(function(d){DL=d||null;if(S.user)render(true)}).catch(function(){})}catch(e){}
})();
</script>
